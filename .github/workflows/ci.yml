name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_run:
    workflows:
      - Update
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scoop:
    name: Scoop
    runs-on: windows-latest
    strategy:
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: Checkout bucket
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          path: bucket
      - name: Checkout Scoop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ScoopInstaller/Scoop
          path: scoop
      - name: Cache test dependencies
        uses: potatoqualitee/psmodulecache@9e4b63833c22c1768d648e115a9c849afdda22a5 # v6.3
        with:
          modules-to-cache: BuildHelpers, Pester, PSScriptAnalyzer
          shell: ${{ matrix.shell }}
      - name: Analyze PowerShell
        run: Invoke-ScriptAnalyzer -Path .\bucket -Recurse -EnableExit
      - name: Test bucket
        env:
          CI: "false"
        run: |
          $env:SCOOP_HOME = Convert-Path .\scoop
          .\bucket\bin\test.ps1

  homebrew:
    name: Homebrew
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Homebrew
        id: homebrew
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c # 2026.07.10.1
        with:
          stable: false
      - name: Cache Homebrew Ruby gems
        id: cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ steps.homebrew.outputs.gems-path }}
          key: ${{ runner.os }}-rubygems-${{ steps.homebrew.outputs.gems-hash }}
          restore-keys: ${{ runner.os }}-rubygems-
      - name: Install Homebrew Ruby gems
        if: steps.cache.outputs.cache-hit != 'true'
        run: brew install-bundler-gems
      - name: Register tap
        run: |
          tap_dir="$(brew --repository)/Library/Taps/zetaloop/homebrew-awesome-fonts"
          mkdir -p "$(dirname "$tap_dir")"
          git clone "$GITHUB_WORKSPACE" "$tap_dir"
          echo "TAP_DIR=$tap_dir" >> "$GITHUB_ENV"
      - name: Test tap
        run: cd "$TAP_DIR" && brew test-bot --only-tap-syntax
